<body>
<div class="cp-root" id="cp-prototype">
<div class="cp-app">
  <aside class="sidebar" aria-label="Menu principal">
    <div class="brand"><span class="brand-mark" aria-hidden="true">c</span><div class="brand-copy"><strong>CLI Proxy</strong><small>ASSINATURAS</small></div></div>
    <div><div class="nav-label">Monitoramento</div><nav class="nav">
      <button type="button" data-nav="overview" aria-label="Visão geral" title="Visão geral" aria-current="page"><span class="nav-icon" aria-hidden="true">◫</span><span class="nav-text">Visão geral</span></button>
      <button type="button" data-nav="accounts" aria-label="Cotas por conta" title="Cotas por conta"><span class="nav-icon" aria-hidden="true">▤</span><span class="nav-text">Cotas por conta</span></button>
      <button type="button" data-nav="history" aria-label="Histórico" title="Histórico"><span class="nav-icon" aria-hidden="true">◷</span><span class="nav-text">Histórico</span></button>
      <button type="button" data-nav="forecast" aria-label="Ritmo e projeções" title="Ritmo e projeções"><span class="nav-icon" aria-hidden="true">↗</span><span class="nav-text">Ritmo e projeções</span></button>
    </nav></div>
    <div class="side-bottom"><button type="button" class="side-link" data-action="snapshot" aria-label="Ver snapshot para escalação">⇄ <span>Dados para escalação</span></button><button type="button" class="side-link" data-action="restore" aria-label="Restaurar dados de demonstração">↶ <span>Restaurar exemplo</span></button><div class="side-note"><span class="live-dot"></span>Monitor V1<br>America/Sao_Paulo</div></div>
  </aside>
  <main class="main" id="screen" aria-live="polite"></main>
</div>
<div class="tooltip" id="chart-tooltip" role="tooltip"></div>
<div class="toast" id="toast" role="status"></div>
<div class="modal-backdrop" id="modal-backdrop" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1"><div class="modal-head"><h2 id="modal-title"></h2><button type="button" class="modal-close" data-action="close-modal" aria-label="Fechar">×</button></div><div class="modal-body" id="modal-body"></div><div class="modal-actions" id="modal-actions"></div></section></div>
</div>
<script>
(() => {
'use strict';
const root = document.getElementById('cp-prototype');
const screen = document.getElementById('screen');
const tip = document.getElementById('chart-tooltip');
const NOW = Date.parse('2026-10-26T18:30:00-03:00');
const HOUR = 3600000;
const providers = [{id:'claude',name:'Claude',mark:'✳'},{id:'codex',name:'Codex',mark:'C'},{id:'meta',name:'Muse',mark:'∞'},{id:'xai',name:'Grok',mark:'𝕏'}];
const seed = [
 {id:'c1',provider:'claude',name:'Principal',email:'principal@example.com',plan:'Max',weekly:94,session:84,model:96,rate:.35,reset:72,sessionReset:2.5,credits:null,eligible:false},
 {id:'c2',provider:'claude',name:'Apoio',email:'apoio@example.com',plan:'Max',weekly:0,session:100,model:94,rate:.55,reset:10.1,sessionReset:null,credits:1,eligible:true},
 {id:'c3',provider:'claude',name:'Reserva',email:'reserva@example.com',plan:'Max',weekly:78,session:8,model:100,rate:1.55,reset:144,sessionReset:1.67,credits:0,eligible:false},
 {id:'o1',provider:'codex',name:'Principal',email:'codex@example.com',plan:'Pro',weekly:68,session:88,model:null,rate:.45,reset:138,sessionReset:3,credits:2,eligible:false},
 {id:'o2',provider:'codex',name:'Reserva',email:'codex.reserva@example.com',plan:'Pro',weekly:24,session:100,model:null,rate:.9,reset:30,sessionReset:null,credits:0,eligible:false},
 {id:'m1',provider:'meta',name:'Principal',email:'muse@example.com',plan:'Assinatura',weekly:82,session:66,model:null,rate:.25,reset:98,sessionReset:4,credits:null,eligible:false},
 {id:'x1',provider:'xai',name:'Principal',email:'grok@example.com',plan:'Assinatura',weekly:null,session:null,model:null,rate:null,reset:null,sessionReset:null,credits:null,eligible:false}
];
let accounts = structuredClone(seed);
const state = {screen:'overview',provider:'all',chart:'remaining',period:24,horizon:7,historyPeriod:7,search:'',emails:false,collapsed:false,focus:'c3',lookback:1,resets:true,refreshed:false,heat:null};
let toastTimer, resizeFrame, lastFocus;
const fmt = (n,d=1) => n == null ? '—' : n.toLocaleString('pt-BR',{maximumFractionDigits:d});
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date = (ms,options={}) => new Intl.DateTimeFormat('pt-BR',{timeZone:'America/Sao_Paulo',...options}).format(ms);
const dateShort = ms => date(ms,{day:'2-digit',month:'short'}).replace('.','');
const dateTime = ms => date(ms,{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const duration = hours => {const mins=Math.max(0,Math.round(hours*60));const d=Math.floor(mins/1440),h=Math.floor(mins%1440/60),m=mins%60;return d ? `${d}d${h?' '+h+'h':''}` : h ? `${h}h${m?' '+m+'min':''}` : `${m}min`;};
const pInfo = id => providers.find(p=>p.id===id);
const forProvider = id => accounts.filter(a=>a.provider===id);
const selected = () => accounts.filter(a=>state.provider==='all'||a.provider===state.provider);
const known = list => list.filter(a=>a.weekly!==null);
const average = list => list.length ? list.reduce((n,a)=>n+a.weekly,0)/list.length : null;
const scopeProvider = () => state.provider==='all'?'claude':state.provider;
const scopeAccounts = () => known(forProvider(scopeProvider()));
const paceFactor = () => state.lookback===1?1:state.lookback===6?.83:.68;
const actualRate = a => a.rate===null?null:a.rate*paceFactor();
const sustainable = a => a.weekly!==null&&a.reset ? a.weekly/a.reset : null;
const isFast = a => a.weekly>0&&a.rate!==null&&actualRate(a)>sustainable(a);
const mark = id => `<span class="provider-mark" aria-hidden="true">${pInfo(id).mark}</span>`;
function rateAt(a,h){if(a.rate===null)return null;return a.rate*(1+2.2*Math.exp(-Math.pow((h-9)/2.6,2))+.12*Math.sin(h*1.4));}
function historic(a,h){let used=0;for(let i=0;i<h;i+=.25)used+=rateAt(a,i)*Math.min(.25,h-i);return Math.min(100,a.weekly+used);}
function projected(a,h){let balance=a.weekly;let start=0;if(state.resets&&a.reset!==null&&h>=a.reset){const repeats=Math.floor((h-a.reset)/168);start=a.reset+repeats*168;balance=100;}return Math.max(0,balance-actualRate(a)*(h-start));}
function badge(a){return a.weekly===null?'<span class="badge">Sem leitura</span>':a.weekly===0?'<span class="badge bad">Sem cota semanal</span>':isFast(a)?'<span class="badge warn">Ritmo acima do sustentável</span>':'<span class="badge ok">Disponível</span>';}
function providerTabs(){return `<div class="provider-tabs" role="group" aria-label="Filtrar provedor"><button type="button" data-filter="all" class="${state.provider==='all'?'active':''}" aria-pressed="${state.provider==='all'}">Todos <span class="count">${accounts.length}</span></button>${providers.map(p=>`<button type="button" data-filter="${p.id}" class="${state.provider===p.id?'active':''}" aria-pressed="${state.provider===p.id}">${p.mark} ${p.name} <span class="count">${forProvider(p.id).length}</span></button>`).join('')}</div>`;}
function header(){const headings={overview:['Visão geral','Limites, consumo e próximas renovações.'],accounts:['Cotas por conta','Cada janela de uso, sem perder o detalhe.'],history:['Histórico de consumo','Encontre os horários, os dias e os picos de uso.'],forecast:['Ritmo e projeções','Veja se o saldo chega até a próxima renovação.']};const [title,sub]=headings[state.screen];return `<div class="topline"><span class="eyebrow">CLI Proxy / Monitor V1</span><span class="demo"><i></i>Protótipo · dados fictícios</span></div><div class="heading"><div><h1>${title}</h1><p class="subtitle">${sub}</p></div><div class="actions"><button type="button" class="btn btn-quiet optional" data-action="info">Sobre os dados</button><button type="button" class="btn btn-primary" data-action="refresh">↻ Atualizar</button></div></div>${providerTabs()}`;}
function cards(){const list=providers.filter(p=>state.provider==='all'||p.id===state.provider);return `<div class="providers">${list.map(p=>{const all=forProvider(p.id),valid=known(all),value=average(valid),blocked=valid.filter(a=>a.weekly===0).length;return `<button type="button" class="provider-card" data-filter="${p.id}" aria-label="Filtrar ${p.name}"><div class="card-name"><span>${mark(p.id)}<strong>${p.name}</strong></span><span class="muted">${all.length} ${all.length===1?'conta':'contas'}</span></div><span class="small muted">Saldo semanal${all.length>1?' médio':''}</span><div class="provider-value num">${value===null?'—':fmt(value)}<small>${value===null?'sem leitura':'%'}</small></div><div class="segments">${all.map(a=>`<div class="track" title="${esc(a.name)}: ${a.weekly===null?'sem leitura':fmt(a.weekly)+'%'}"><span style="width:${a.weekly||0}%;background:${a.weekly===0?'var(--cp-bad)':a.weekly<25?'var(--cp-warn)':'var(--cp-good)'}"></span></div>`).join('')}</div><div class="provider-footer">${value===null?'Aguardando uma leitura válida':blocked?`<span class="danger"><span class="status-dot"></span>${blocked} conta sem cota semanal</span>`:valid.some(isFast)?'<span class="warning"><span class="status-dot"></span>Atenção ao ritmo de consumo</span>':'<span class="good"><span class="status-dot"></span>Dentro do ritmo sustentável</span>'}</div></button>`;}).join('')}</div>`;}
function summary(){const list=selected(),valid=known(list);return `<div class="summary-line"><span><strong>${valid.length} de ${list.length}</strong> contas com leitura</span><span><strong>${valid.filter(a=>a.weekly===0).length}</strong> sem cota semanal</span><span><strong>${valid.filter(isFast).length}</strong> com ritmo alto</span><span class="summary-end">Leitura simulada · ${state.refreshed?'18:30':'18:27'} BRT</span></div>`;}
function chartControls(){return `<div class="chart-tabs" role="tablist" aria-label="Tipo de gráfico"><button type="button" role="tab" aria-selected="${state.chart==='remaining'}" data-chart-tab="remaining" class="${state.chart==='remaining'?'active':''}">Saldo e projeção</button><button type="button" role="tab" aria-selected="${state.chart==='rate'}" data-chart-tab="rate" class="${state.chart==='rate'?'active':''}">Ritmo de consumo</button></div>`;}
function mainChart(){const list=scopeAccounts(),provider=pInfo(scopeProvider()),avg=average(list),rate=list.length?list.reduce((v,a)=>v+actualRate(a),0)/list.length:null;return `<section class="panel"><div class="panel-top"><div><h2>Como está o seu saldo?</h2><p>${provider.name} · janela semanal · ${list.length} ${list.length===1?'conta':'contas'}${list.length>1?' · média simples':''}</p></div><button type="button" class="toggle-chart" data-action="collapse" aria-label="${state.collapsed?'Expandir':'Recolher'} gráficos" aria-expanded="${!state.collapsed}">${state.collapsed?'⌄':'⌃'}</button></div><div class="chart-summary"><strong class="big num">${avg===null?'—':fmt(avg)+'%'}</strong><small>restante${list.length>1?' em média':''}</small><span class="pace num">${rate===null?'Ritmo desconhecido':fmt(rate,2)+' p.p./h · média por conta'}</span></div>${state.collapsed?'':`${chartControls()}<div class="chart-toolbar"><div class="legend">${state.chart==='remaining'?'<span><i class="legend-mark"></i>Observado</span><span><i class="legend-mark dashed"></i>Projetado</span>':'<span><i class="legend-mark"></i>Média de uma hora</span>'}</div><label>${state.chart==='remaining'?`<span class="sr">Horizonte de projeção</span><select data-select="horizon"><option value="3" ${state.horizon===3?'selected':''}>Próximos 3 dias</option><option value="7" ${state.horizon===7?'selected':''}>Próximos 7 dias</option><option value="14" ${state.horizon===14?'selected':''}>Próximos 14 dias</option></select>`:`<span class="sr">Período do consumo</span><select data-select="period">${[6,24,168].map(v=>`<option value="${v}" ${state.period===v?'selected':''}>${v===168?'Últimos 7 dias':'Últimas '+v+' horas'}</option>`).join('')}</select>`}</label></div>${list.length?`<div class="chart" data-chart="${state.chart}"></div>`:'<div class="chart-empty"><strong>Sem leitura disponível</strong><span>O gráfico aparece quando houver dados suficientes.</span></div>'}<div class="chart-note"><span>${state.chart==='remaining'?'Previsão baseada no ritmo observado · resets informados':`Resets excluídos · lacunas indicam coleta ausente`}</span><button type="button" class="text-button" data-action="${state.chart==='remaining'?'settings':'rate-info'}">${state.chart==='remaining'?'Ajustar previsão':'Como o ritmo é calculado'}</button></div>`}</section>`;}
function upcoming(){const list=known(selected()).filter(a=>a.reset!==null).sort((a,b)=>a.reset-b.reset).slice(0,4);return `<section class="panel reset-panel"><div class="panel-top"><div><h2>Próximas renovações</h2><p>Janela semanal de cada conta</p></div></div>${list.map(a=>`<div class="reset-row">${mark(a.provider)}<div><h3>${pInfo(a.provider).name}</h3><p>${a.name}</p></div><div class="reset-time num">Em ${duration(a.reset)}<small>${dateTime(NOW+a.reset*HOUR)}</small></div></div>`).join('')}<p class="aside-caption">O saldo é recomposto por conta. As janelas de cinco horas têm seu próprio reset.</p></section>`;}
function attention(){const list=selected().filter(a=>a.weekly===null||a.weekly===0||isFast(a));return `<div class="section-title"><h2>Contas que merecem atenção</h2><button type="button" class="text-button" data-go="accounts">Ver todas as contas →</button></div><div class="panel attention-list">${list.length?list.map(a=>`<div class="attention-row"><div class="attention-label">${mark(a.provider)}<div><h3>${pInfo(a.provider).name} · ${a.name}</h3><p>${a.weekly===null?'Ainda não há uma leitura válida':a.weekly===0?'Cota semanal esgotada · volta em '+duration(a.reset):'Pode esgotar em '+duration(a.weekly/actualRate(a))+' · renova em '+duration(a.reset)}</p></div></div>${a.weekly===null?badge(a):`<button type="button" class="btn btn-small btn-quiet" data-focus="${a.id}">${a.weekly===0?'Ver limites':'Ver projeção'} →</button>`}</div>`).join(''):'<p class="muted small">Todas as contas selecionadas estão dentro do ritmo sustentável.</p>'}</div>`;}
function overview(){const fast=known(selected()).filter(isFast);return `${cards()}${summary()}${fast.length?`<div class="notice"><div class="notice-text"><span class="notice-symbol" aria-hidden="true">↗</span><span><strong>${fast.length} ${fast.length===1?'conta pode':'contas podem'} esgotar antes da renovação.</strong><br><span class="muted">Compare o ritmo recente com a folga até o reset.</span></span></div><button type="button" class="btn btn-small btn-quiet" data-go="forecast">Ver projeções →</button></div>`:''}<div class="overview-grid">${mainChart()}${upcoming()}</div>${attention()}`;}
function windowCell(a,key,label,reset){const value=a[key];const color=value===0?'var(--cp-bad)':value<20?'var(--cp-warn)':'var(--cp-good)';return `<div class="window"><div class="window-title"><span>${label}</span><strong class="num">${value===null?'—':fmt(value)+'%'}</strong></div><div class="track"><span style="width:${value||0}%;background:${color}"></span></div><p>${value===null?'Sem informação':reset===null?'Nenhum reset informado':'Em '+duration(reset)+' · '+dateTime(NOW+reset*HOUR)}</p></div>`;}
function accountRows(){const query=state.search.toLowerCase().trim();const list=selected().filter(a=>[a.name,a.email,pInfo(a.provider).name].some(v=>v.toLowerCase().includes(query)));if(!list.length)return '<div class="empty">Nenhuma conta corresponde à busca.</div>';return providers.map(p=>{const group=list.filter(a=>a.provider===p.id);if(!group.length)return '';return `<section class="ledger-group"><div class="ledger-group-head">${mark(p.id)}<h2>${p.name}</h2><span class="muted">${group.length} ${group.length===1?'conta':'contas'}</span></div>${group.map(a=>`<article class="account-row" data-account="${a.id}"><div class="account-identity"><div><div class="account-name">${a.name}</div><div class="account-meta">${state.emails?esc(a.email):p.name+' · '+a.plan}</div><div class="account-meta">${a.weekly===null?'Nenhuma leitura válida':'Última leitura: '+(state.refreshed?'agora':'há 3 min')}</div></div><div class="account-state">${a.weekly===0?`<span class="danger">Volta em ${duration(a.reset)}</span>`:a.weekly===null?'<span class="muted">Aguardando leitura</span>':a.session<15?'<span class="warning">Pouca cota de sessão</span>':'<span class="good">Disponível</span>'}</div></div>${windowCell(a,'weekly','Semanal',a.reset)}${windowCell(a,'session','Sessão de 5h',a.sessionReset)}${a.provider==='claude'?windowCell(a,'model','Fable 5 · 7 dias',a.reset):'<div class="window"><div class="window-title"><span>Limite por modelo</span><strong>—</strong></div><div class="track"></div><p>Não se aplica neste exemplo</p></div>'}<div class="account-actions"><small>Créditos de reset: <strong class="num">${a.credits===null?'—':a.credits}</strong></small><button type="button" class="btn btn-quiet" data-refresh-account="${a.id}">↻ Atualizar cota</button><button type="button" class="btn btn-quiet" data-reset="${a.id}" ${!a.eligible?'disabled title="Reset indisponível ou elegibilidade não informada"':''}>↶ Resetar limite</button></div></article>`).join('')}</section>`;}).join('');}
function accountScreen(){return `${cards()}${summary()}<div class="ledger-toolbar"><label class="search-wrap"><span class="search-symbol" aria-hidden="true">⌕</span><span class="sr">Buscar por conta ou e-mail</span><input id="account-search" placeholder="Buscar conta ou e-mail" value="${esc(state.search)}" autocomplete="off"></label><div class="actions"><button type="button" class="btn btn-quiet btn-small" data-action="emails" aria-pressed="${state.emails}">${state.emails?'Ocultar':'Mostrar'} e-mails</button><span class="small muted">Visualização em lista</span></div></div><div id="account-rows">${accountRows()}</div>`;}
function historyData(){const provider=scopeProvider(),factor={claude:1,codex:.8,meta:.42,xai:0}[provider];const size=state.historyPeriod===1?24:state.historyPeriod===7?7:30;return Array.from({length:size},(_,i)=>({x:i,y:factor*(state.historyPeriod===1?1.1+(i%5)*.9:12+(i*11%23)+3*Math.sin(i*1.5)),label:state.historyPeriod===1?`${String(i).padStart(2,'0')}h`:dateShort(NOW-(size-1-i)*24*HOUR)}));}
function heatmap(){const vals=[];let html='<div class="heatmap"><div></div>';for(let h=0;h<24;h++)html+=`<div class="heat-head">${h%6===0||h===23?String(h).padStart(2,'0'):''}</div>`;for(let d=0;d<7;d++){const ms=Date.UTC(2026,9,20+d,15);html+=`<div class="heat-label">${date(ms,{weekday:'short'}).replace('.','')}</div>`;for(let h=0;h<24;h++){const missing=d===2&&h>=3&&h<=5;const value=missing?null:.13+Math.max(0,Math.sin((h-7)/24*Math.PI*2))*(1.2+d*.12)+(d*7+h*3)%5*.09;const label=`${dateShort(ms)} às ${String(h).padStart(2,'0')}h · ${value===null?'sem coleta':fmt(value,2)+' p.p. por hora'}`;const id=`${d}-${h}`;vals.push({id,label,value});html+=`<button type="button" class="heat-cell ${missing?'missing':''} ${state.heat===id?'selected':''}" data-heat="${id}" data-heat-label="${esc(label)}" aria-label="${esc(label)}" title="${esc(label)}" style="--level:${missing?0:Math.min(.9,.1+value/2.4)}"></button>`;}}html+='</div>';const item=vals.find(v=>v.id===state.heat);return `${html}<div class="heat-legend"><span>Menor consumo</span>${[.1,.3,.5,.7,.9].map(level=>`<span class="square" style="--level:${level}"></span>`).join('')}<span>Maior consumo</span><span style="margin-left:auto">Horário de São Paulo</span></div><div class="heat-detail" id="heat-detail">${item?item.label:'Selecione uma célula para inspecionar a hora. Áreas hachuradas não têm coleta.'}</div>`;}
function historyScreen(){const list=scopeAccounts(),data=historyData(),total=data.reduce((v,d)=>v+d.y,0);if(!list.length)return '<div class="panel empty">Este provedor ainda não tem histórico disponível.</div>';return `<div class="metric-grid"><div class="metric"><span class="metric-label">Consumo no período</span><div class="metric-value num">${fmt(total)} <small>p.p.</small></div><div class="metric-caption">Média por conta · janela semanal</div></div><div class="metric"><span class="metric-label">Maior ritmo observado</span><div class="metric-value num">${fmt(Math.max(...Array.from({length:24},(_,i)=>list.reduce((v,a)=>v+rateAt(a,i),0)/list.length)),2)} <small>p.p./h</small></div><div class="metric-caption">Média de uma hora · exemplo</div></div><div class="metric"><span class="metric-label">Cobertura da coleta</span><div class="metric-value num">98,2<small>%</small></div><div class="metric-caption">3 de 168 intervalos sem leitura</div></div></div><div class="history-grid"><section class="panel"><div class="panel-top"><div><h2>Consumo ${state.historyPeriod===1?'por hora':'por dia'}</h2><p>${pInfo(scopeProvider()).name} · p.p. médios por conta · janela semanal</p></div><label><span class="sr">Período do histórico</span><select data-select="historyPeriod">${[1,7,30].map(v=>`<option value="${v}" ${state.historyPeriod===v?'selected':''}>${v===1?'Últimas 24 horas':'Últimos '+v+' dias'}</option>`).join('')}</select></label></div><div class="chart large" data-chart="daily"></div><div class="chart-note"><span>O consumo é acumulado dentro de cada ciclo.</span><span>Renovações não entram como consumo.</span></div></section><section class="panel reset-panel"><div class="panel-top"><h2>Leitura do período</h2></div><div class="stat-row"><span>Provedor</span><strong>${pInfo(scopeProvider()).name}</strong></div><div class="stat-row"><span>Contas com dados</span><strong>${list.length}</strong></div><div class="stat-row"><span>Janela</span><strong>Semanal</strong></div><div class=  const x=v=>M.l+(v-minX)/(maxX-minX)*pw,y=v=>M.t+(1-v/yMax)*ph;const path=(data)=>{let started=false;return data.map(p=>{if(p.y===null){started=false;return '';}const code=started?'L':'M';started=true;return `${code}${x(p.x).toFixed(2)},${y(p.y).toFixed(2)}`;}).join(' ');};const area=data=>{const sections=[];let current=[];for(const p of data){if(p.y===null){if(current.length)sections.push(current);current=[];}else current.push(p);}if(current.length)sections.push(current);return sections.map(v=>`${path(v)} L${x(v.at(-1).x)},${y(0)} L${x(v[0].x)},${y(0)} Z`).join(' ');};const id='fill-'+type;let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(yTitle)}. Dados fictícios. Use o ponteiro ou as setas para inspecionar."><title>${esc(yTitle)}</title><desc>Histórico de demonstração. Lacunas significam coleta ausente; projeções são estimativas.</desc><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--cp-accent)" stop-opacity=".23"/><stop offset="100%" stop-color="var(--cp-accent)" stop-opacity=".015"/></linearGradient><clipPath id="clip-${type}"><rect x="${M.l}" y="${M.t}" width="${pw}" height="${ph}"/></clipPath></defs><text x="${M.l}" y="11">${esc(yTitle)}</text>`;
 for(let i=0;i<=4;i++){const value=yMax*i/4;svg+=`<line class="chart-grid" x1="${M.l}" x2="${W-M.r}" y1="${y(value)}" y2="${y(value)}"/><text x="${M.l-9}" y="${y(value)+4}" text-anchor="end">${fmt(value,value<5?1:0)}</text>`;}
 let ticks;if(type==='daily'){const step=Math.max(1,Math.ceil(bars.length/(W<450?4:7)));ticks=bars.filter((_,i)=>i%step===0||i===bars.length-1).map(p=>({at:p.x,label:p.label}));if(ticks.length>1&&ticks.at(-1).at-ticks.at(-2).at<step*.6)ticks.splice(-2,1);}else if(type==='rate'){ticks=Array.from({length:W<450?4:5},(_,i)=>{const at=minX+(maxX-minX)*i/(W<450?3:4);return{at,label:state.period>24?dateShort(NOW+at*HOUR):date(NOW+at*HOUR,{hour:'2-digit',minute:'2-digit'})};});}else{ticks=W<450?[{at:-24,label:'Ontem'},{at:0,label:'Agora'},{at:maxX/2,label:dateShort(NOW+maxX/2*HOUR)},{at:maxX,label:dateShort(NOW+maxX*HOUR)}]:[-24,0,24,72,120,168,240,336].filter(v=>v<=maxX).map(at=>({at,label:at===-24?'Ontem':at===0?'Agora':dateShort(NOW+at*HOUR)}));if(ticks.length>1&&Math.abs(x(ticks[1].at)-x(ticks[0].at))<38)ticks.shift();}

 svg+=`</g><g data-hover hidden><line class="chart-guide" data-guide y1="${M.t}" y2="${H-M.b}"/><circle data-dot r="4" fill="var(--cp-accent)" stroke="var(--cp-panel)" stroke-width="2"/></g><rect data-hit x="${M.l}" y="${M.t}" width="${pw}" height="${ph}" fill="transparent" tabindex="0" role="slider" aria-label="Inspecionar o gráfico" aria-valuemin="${minX}" aria-valuemax="${maxX}" aria-valuenow="0"/></svg>`;host.innerHTML=svg;const overlay=host.querySelector('[data-hit]');const guide=host.querySelector('[data-hover]');let keyIndex=0;const all=type==='daily'?bars:[...points,...future];
 function inspect(event,at){let value=null,note='',label='';if(type==='daily'){const b=bars[Math.max(0,Math.min(bars.length-1,Math.round(at)))];at=b.x;value=b.y;label=b.label;note='Média por conta · janela semanal';}else{const series=at>0?future:points;let left=null,right=null;for(let i=0;i<series.length;i++){if(series[i].x<=at)left=series[i];if(series[i].x>=at){right=series[i];break;}}if(left&&right&&left.y!==null&&right.y!==null){const fraction=right.x===left.x?0:(at-left.x)/(right.x-left.x);value=left.y+(right.y-left.y)*fraction;}label=dateTime(NOW+at*HOUR);note=at>0?'Projeção estimada · resets '+(state.resets?'considerados':'ignorados'):value===null?'Intervalo sem coleta':'Leitura de demonstração';}overlay.setAttribute('aria-valuenow',String(at));overlay.setAttribute('aria-valuetext',label+': '+(value===null?'sem coleta':fmt(value,2)+unit));guide.removeAttribute('hidden');host.querySelector('[data-guide]').setAttribute('x1',x(at));host.querySelector('[data-guide]').setAttribute('x2',x(at));const dot=host.querySelector('[data-dot]');dot.setAttribute('cx',x(at));dot.setAttribute('cy',y(value||0));dot.style.display=value===null?'none':'';showTip(event,label,value===null?'Sem leitura disponível':fmt(value,2)+unit,note);}
 overlay.addEventListener('pointermove',event=>{const rect=host.querySelector('svg').getBoundingClientRect();const px=(event.clientX-rect.left)*W/rect.width;inspect(event,Math.max(minX,Math.min(maxX,minX+(px-M.l)/pw*(maxX-minX))));});overlay.addEventListener('pointerleave',()=>{guide.setAttribute('hidden','');tip.style.display='none';});overlay.addEventListener('blur',()=>{guide.setAttribute('hidden','');tip.style.display='none';});overlay.addEventListener('keydown',event=>{if(event.key!=='ArrowRight'&&event.key!=='ArrowLeft')return;event.preventDefault();keyIndex=Math.max(0,Math.min(all.length-1,keyIndex+(event.key==='ArrowRight'?1:-1)));const rect=host.getBoundingClientRect();inspect({clientX:rect.left+M.l+(keyIndex/Math.max(1,all.length-1))*pw,clientY:rect.top+H/2},all[keyIndex].x);});
}
new ResizeObserver(()=>{cancelAnimationFrame(resizeFrame);resizeFrame=requestAnimationFrame(drawCharts);}).observe(screen);
render();
})();
